apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
      annotations:
        # Rolls the pods whenever the message changes, so an upgrade is a real
        # rollout rather than a no-op the tracker would skip.
        nelmwave.io/message: {{ .Values.message | quote }}
    spec:
      containers:
        - name: pause
          image: {{ .Values.image | quote }}
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
