# Step two of a release: the release PR landed on main, so tag that commit and
# publish everything from it.
#
# Tagging and publishing are one job on purpose. A tag pushed with GITHUB_TOKEN
# does not trigger workflows, so a separate tag-then-release pair would need a
# PAT just to hand work to itself.
name: release

on:
  push:
    branches:
      - main
    # Only the release PR touches CHANGELOG.md — changie fragments live in
    # .changes/unreleased/, and ordinary PRs never regenerate it.
    paths:
      - CHANGELOG.md
  # Escape hatch: re-run a failed publish for whatever `changie latest` says.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # create the tag and the GitHub release
  packages: write # push to ghcr.io

jobs:
  release:
    name: tag and publish
    runs-on: ubuntu-latest
    steps:
      # The same helmwave-bot GitHub App the helmwave release uses, via the
      # organization secrets GH_APP_ID / GH_APP_PRIVATE_KEY — no per-repository
      # PAT to rotate, and the token expires an hour after the run.
      #
      # `owner` without `repositories` mints a token for every repository the app
      # is installed on (it is installed org-wide), which is what pushing the
      # formula to helmwave/homebrew-tap needs: GITHUB_TOKEN cannot reach another
      # repository.
      #
      # First step on purpose: it fails outright when the app secrets are missing,
      # so a misconfigured release stops before the tag exists. An earlier revision
      # let goreleaser skip the Homebrew upload with a warning nobody reads, and
      # v1.0.0 shipped with no formula in the tap.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # So the tag below is pushed by the bot, matching the author it is
          # stamped with and the identity that publishes everything downstream.
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: miniscruff/changie-action@v3
        with:
          version: latest
          args: --version

      # The version comes from the batched changelog, never from a hand-typed
      # tag: whatever was reviewed in the release PR is what gets published.
      - name: resolve the version
        id: version
        run: |
          set -euo pipefail

          # Empty before the very first release-pr run, and on a workflow_dispatch
          # against a trunk that has never been batched.
          version=$(changie latest 2>/dev/null || true)
          if [ -z "$version" ]; then
            echo "::notice::no batched version in .changes/ yet; run the release-pr workflow first."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ ! -f ".changes/${version}.md" ]; then
            echo "::error::.changes/${version}.md is missing — was the changelog batched?"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/${version}" >/dev/null; then
            echo "::notice::${version} is already tagged; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

          # Date only, taken from the commit, so rebuilding this tag stamps the
          # same value — the same trick the Makefile documents.
          echo "date=$(git log -1 --format=%cs)" >> "$GITHUB_OUTPUT"

      - name: tag the commit
        if: steps.version.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          git config user.name  "helmwave-bot[bot]"
          git config user.email "171518341+helmwave-bot[bot]@users.noreply.github.com"

          git tag -a "$VERSION" -m "$VERSION"
          git push origin "$VERSION"

      # goreleaser reads the multi-arch images out of this builder.
      - uses: docker/setup-qemu-action@v4
        if: steps.version.outputs.skip == 'false'

      - uses: docker/setup-buildx-action@v4
        if: steps.version.outputs.skip == 'false'

      - uses: docker/login-action@v4
        if: steps.version.outputs.skip == 'false'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: goreleaser release
        if: steps.version.outputs.skip == 'false'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean --release-notes .changes/${{ steps.version.outputs.version }}.md
        env:
          # The app token, not GITHUB_TOKEN: the GitHub release and the tap commit
          # both come from helmwave-bot, exactly as in helmwave. (The ghcr push
          # authenticates separately, through the docker login step above.)
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # goreleaser reads this by name for `brews` — no `token:` in
          # .goreleaser.yaml, so a local `goreleaser release` cannot silently fall
          # back to a personal token.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          BUILD_DATE: ${{ steps.version.outputs.date }}

      - name: summary
        if: steps.version.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "## ${VERSION} published"
            echo
            echo "- [release notes](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${VERSION})"
            echo "- \`docker pull ghcr.io/helmwave/nelmwave:${VERSION#v}\`"
          } >> "$GITHUB_STEP_SUMMARY"
