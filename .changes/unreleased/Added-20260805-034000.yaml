kind: Added
body: >-
  A `namespace` block per release covering `create` (default `true`), `delete`
  (default `false`), and `labels`/`annotations` merged onto the namespace object.
  Metadata is applied **before** the release, so a policy label such as
  `istio-injection` or `pod-security.kubernetes.io/enforce` is in place before any
  workload is created; with `create: false` an existing namespace is patched rather
  than created behind your back, `down` warns for every release carrying `delete`, and
  writing `namespace: production` as a string is an error rather than a silent no-op
time: 2026-08-05T03:40:00.000000000+03:00
