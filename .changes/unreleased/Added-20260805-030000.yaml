kind: Added
body: >-
  `needs`: dependency edges combining explicit `needs.releases` entries with an
  inlined label selector (`matchLabels`, `matchLabelsExpressions`). A named dependency
  is required by default and `optional: true` downgrades it to a warning;
  label-matched dependencies are always optional, an empty selector matches nothing,
  and cycles are rejected at build time with the cycle printed
