kind: Added
body: >-
  `-l/--selector` with Kubernetes-style label selectors (`app=api,env in
  (prod,stg),tier!=db`), and `--include-needs` widening the selection along the graph
  in the direction the command travels: dependencies for `up` and `diff`, dependents
  for `down`. Without it `up` refuses to run when a required dependency is filtered
  out. Every run logs the final selection, and anything the selector did not name is
  called out as a warning
time: 2026-08-05T04:30:00.000000000+03:00
