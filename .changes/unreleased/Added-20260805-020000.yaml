kind: Added
body: >-
  Chart signature verification per repository: `provenanceStrategy` (`never`,
  `if-possible`, `always`, `later`) with `provenanceKeyring` for the public keys,
  defaulting to helm's `~/.gnupg/pubring.gpg`. OCI charts are matched to their
  registry by address prefix, longest first
