kind: Added
body: >-
  `repositories`: a map keyed by helm-repo alias or OCI registry host, where the URL
  scheme decides how it is reached. Each entry takes `username`/`password`,
  `insecureSkipTLSVerify`, `passCredentials`, `caFile`, `certFile`/`keyFile` for mTLS,
  `skipUpdate` and a per-repository `requestTimeout`. There is no `repositories.yaml`
  step — helm charts are fetched `--repo` style and OCI credentials reach nelm through
  a generated temporary `config.json`
