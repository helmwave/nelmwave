kind: Added
body: >-
  In-process decryption of `.yml.sops` and `.yml.tpl.sops` sources — the `sops` binary
  is not required, and keys come from the ambient environment exactly as they do for
  the sops CLI (`SOPS_AGE_KEY_FILE`/`SOPS_AGE_KEY`, GnuPG, cloud KMS). The format
  handed to sops follows the extension underneath `.sops`, and `build` warns out loud
  whenever a run wrote decrypted material into `.nelmwave/`
