kind: Added
body: >-
  `build` is the only phase that renders anything: it writes a self-contained plan
  into `.nelmwave/` — `planfile.yml` plus resolved `values/<uniqname>/` and
  `stores/<uniqname>/` artifacts — and `up`, `down` and `diff` read that plan without
  re-rendering, so what was reviewed is what gets applied. `build` needs no cluster
  and downloads no charts, and the planfile is deterministic (map keys sorted) so it
  diffs cleanly in review
