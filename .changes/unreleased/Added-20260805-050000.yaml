kind: Added
body: >-
  `nelmwave completion` for bash, zsh, fish and powershell, completing values as well
  as names: label keys and their values from the built plan behind `-l`, kube-contexts
  from the kubeconfig, the accepted `--log-level`/`--log-format` values, and manifests
  behind `--file`/`--output`. The commands take no positional arguments, so nothing
  irrelevant is offered
time: 2026-08-05T05:00:00.000000000+03:00
