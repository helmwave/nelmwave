kind: Added
body: >-
  Resource policies per release: `forceAdoption` to take over resources another helm
  release claims, `removeManualChanges` (default `true`) to reclaim hand-edited
  fields, `installCRDs` (default `true`) for the chart's `crds/` directory,
  `deletePropagation` (`Foreground`/`Background`/`Orphan`, validated at build time)
  and `historyLimit` (default `10`). `deletePropagation` and `historyLimit` apply to
  `down` too, and `removeManualChanges` applies to `diff` so the preview matches the
  apply
time: 2026-08-05T04:00:00.000000000+03:00
